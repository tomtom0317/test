<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>テストしゅうちゅうチャレンジ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f8ff;color:#283447;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.w{max-width:820px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #dce5f1;border-radius:24px;padding:16px;box-shadow:0 5px 18px #0001}h1{text-align:center;font-size:26px;margin:0 0 8px}.info,.rule{text-align:center;border-radius:16px;padding:12px;font-weight:800;line-height:1.7}.info{background:#eef5ff}.rule{background:#fff8dc;margin:12px 0}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}.cell{min-height:68px;border:2px dashed #cbd7e5;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900}.cell.done{background:#fff5c8;border-style:solid;border-color:#dfb949}.goal{grid-column:span 4;background:#ecf8e8;border:2px solid #88b878;border-radius:18px;padding:12px;text-align:center;font-size:22px;font-weight:900}.sets,.choices{display:grid;gap:9px}button{appearance:none;background:#fff;border:2px solid #d5e0ec;border-radius:16px;padding:12px;font-size:17px;font-weight:800;color:#283447}.setbtn{text-align:left}.setbtn.done{background:#fff6ce;border-color:#dfb84b}.top{display:flex;justify-content:space-between;gap:8px}.pill{border:1px solid #dce5f1;border-radius:99px;padding:8px 11px;font-weight:900}.qbox{background:#fafcff;border:1px solid #dce5f1;border-radius:18px;padding:14px;text-align:center;margin-top:10px}.scene{font-size:62px}.qtext{font-size:21px;font-weight:900;line-height:1.6}.choice{text-align:left}.choice.correct{background:#eaf8ee;border-color:#65a578}.choice.wrong{background:#ffecec;border-color:#d97878}.msg{min-height:72px;text-align:center;font-weight:900;line-height:1.6;padding:10px}.explain{background:#fff7e6;border-radius:14px;padding:10px;margin-top:8px}.primary{background:#4d78d8;color:#fff;border-color:#4d78d8}.hidden{display:none!important}.result{text-align:center}.big{font-size:80px}.stamp{font-size:84px}#fx{position:fixed;inset:0;pointer-events:none;z-index:99}.cf{position:absolute;width:9px;height:15px;animation:f 1.2s ease-out forwards}@keyframes f{to{transform:translate(var(--x),var(--y)) rotate(600deg);opacity:0}}
</style></head><body><div id="fx"></div><div class="w">
<section id="home" class="card"><h1>🎒 テスト しゅうちゅうチャレンジ</h1><div class="info">「できる」だけじゃなくて、<b>せんせいの はなしを きく・しずかにする・さいごまで やる・みなおす</b> も たいせつ！</div><div class="rule">👀 めは もんだい<br>👂 みみは せんせい<br>🤫 おくちは しずか<br>🔍 はやく おわったら みなおし</div><div id="board" class="board"></div><div id="sets" class="sets"></div><button id="reset" style="width:100%;margin-top:10px">きろくを リセット</button></section>
<section id="quiz" class="card hidden"><div class="top"><span id="sp" class="pill"></span><span id="qp" class="pill"></span></div><div class="qbox"><div id="scene" class="scene"></div><div id="qt" class="qtext"></div></div><div id="choices" class="choices" style="margin-top:14px"></div><div id="msg" class="msg"></div><button id="next" class="primary hidden" style="width:100%">つぎの もんだい</button><button id="back" style="width:100%;margin-top:8px">← もどる</button></section>
<section id="result" class="card result hidden"><div id="big" class="big"></div><h1 id="rt"></h1><p id="rr"></p><div id="stamp" class="stamp hidden">⭐</div><button id="rb" class="primary" style="width:100%"></button></section>
</div><script>
var SETS=[{"title": "せんせいの おはなしを きく", "questions": [{"icon": "👂", "scene": "せんせいが もんだいの やりかたを せつめいしています。どうする？", "choices": ["せんせいの ほうを みて しずかに きく", "となりの こに はなしかける", "さきに もんだいを はじめる"], "correct": 0, "explain": "おはなしを きかないと、やりかたを まちがえてしまうことが あるよ。"}, {"icon": "📣", "scene": "「まだ はじめません」と いわれました。どうする？", "choices": ["あいずが あるまで まつ", "こっそり はじめる", "となりの こに きく"], "correct": 0, "explain": "しじを まもることも テストの だいじな ちからだよ。"}, {"icon": "👀", "scene": "せんせいが みほんを みせています。どうする？", "choices": ["よく みて おぼえる", "つくえの したを みる", "ともだちを みる"], "correct": 0, "explain": "みほんを よく みると、つぎに なにを するか わかるよ。"}, {"icon": "🙋", "scene": "しじが わからなくなりました。どうする？", "choices": ["てを あげて せんせいに きく", "となりの こに はなす", "てきとうに やる"], "correct": 0, "explain": "わからないときは、せんせいに しずかに たしかめよう。"}, {"icon": "🔔", "scene": "せんせいが つぎの しじを だしました。どうする？", "choices": ["すぐに きいて そのとおりに する", "いまの ことを ずっと つづける", "となりの こに しゃべる"], "correct": 0, "explain": "しじを きりかえて うごけると かっこいいよ。"}]}, {"title": "テストちゅうは しずかに", "questions": [{"icon": "🤫", "scene": "テストちゅう、となりの こに はなしたいことが できました。どうする？", "choices": ["テストがおわるまで はなさない", "すぐに はなしかける", "こえを ひそめて はなす"], "correct": 0, "explain": "はなすと、じぶんも ともだちも しゅうちゅうできなくなるよ。"}, {"icon": "🧒", "scene": "となりの こが はやく おわりました。どうする？", "choices": ["じぶんの もんだいに しゅうちゅうする", "こたえを きく", "いっしょに おしゃべりする"], "correct": 0, "explain": "ひとの すすみかたを きにせず、じぶんの テストに しゅうちゅうしよう。"}, {"icon": "🗣️", "scene": "こたえが わかって うれしくなりました。どうする？", "choices": ["こえに ださず しずかに かく", "おおきな こえで いう", "となりの こに おしえる"], "correct": 0, "explain": "わかっても しずかに こたえを かこう。"}, {"icon": "🪑", "scene": "からだを うごかしたくなりました。どうする？", "choices": ["しせいを なおして もんだいに もどる", "いすを ゆらす", "たちあるく"], "correct": 0, "explain": "からだを おちつけると、あたまも しゅうちゅうしやすくなるよ。"}, {"icon": "👂", "scene": "となりから こえが きこえました。どうする？", "choices": ["きにせず じぶんの もんだいを つづける", "へんじを する", "はなしに はいる"], "correct": 0, "explain": "まわりに つられず、じぶんの ことを つづけよう。"}]}, {"title": "はやく おわっても みなおす", "questions": [{"icon": "⏰", "scene": "もんだいが はやく おわりました。どうする？", "choices": ["さいしょから みなおす", "ぼんやり する", "となりの こを みる"], "correct": 0, "explain": "はやく おわった じかんは みなおしに つかおう。"}, {"icon": "🔍", "scene": "みなおしで まず たしかめることは？", "choices": ["こたえぬけが ないか", "ともだちの こたえ", "えんぴつの いろ"], "correct": 0, "explain": "こたえを かいていない ところが ないか たしかめよう。"}, {"icon": "🧮", "scene": "さんすうが おわりました。どうする？", "choices": ["けいさんを もういちど たしかめる", "すぐに えんぴつを おく", "まわりを みる"], "correct": 0, "explain": "けいさんは もういちど やると うっかりミスに きづけるよ。"}, {"icon": "📖", "scene": "こくごが おわりました。どうする？", "choices": ["もんだいを もういちど よむ", "となりに はなしかける", "つくえで あそぶ"], "correct": 0, "explain": "よみちがいが ないか たしかめよう。"}, {"icon": "✏️", "scene": "じが よみにくい ところが ありました。どうする？", "choices": ["ていねいに かきなおす", "そのままにする", "ぜんぶ けす"], "correct": 0, "explain": "せんせいが よめる じに しておこう。"}]}, {"title": "さいごまで しゅうちゅう", "questions": [{"icon": "💪", "scene": "むずかしい もんだいが でました。どうする？", "choices": ["できる ところから さいごまで やる", "すぐに あきらめる", "となりを みる"], "correct": 0, "explain": "むずかしくても、できるところを さがして さいごまで やってみよう。"}, {"icon": "🧩", "scene": "ひとつの もんだいで ながく まよっています。どうする？", "choices": ["いったん とばして あとで もどる", "ずっと そこだけ みる", "テストを やめる"], "correct": 0, "explain": "ひとつに じかんを つかいすぎないことも だいじだよ。"}, {"icon": "📄", "scene": "まだ うらにも もんだいが ありました。どうする？", "choices": ["うらも さいごまで やる", "おわったと おもって やめる", "となりに きく"], "correct": 0, "explain": "さいごの ページまで あるか たしかめよう。"}, {"icon": "🕒", "scene": "あと すこしで じかんが おわります。どうする？", "choices": ["できる ところを さいごまで かく", "もう やめる", "あわてて てきとうに かく"], "correct": 0, "explain": "さいごまで おちついて できることを やろう。"}, {"icon": "✅", "scene": "おわりの あいずまで じかんが あります。どうする？", "choices": ["みなおしを つづける", "おしゃべりする", "つくえに ふせる"], "correct": 0, "explain": "おわりの あいずまで テストの じかんだよ。"}]}, {"title": "じつぎでも しじを きく", "questions": [{"icon": "🏃", "scene": "じつぎの せつめいを しています。どうする？", "choices": ["うごかず せんせいを みて きく", "さきに うごく", "ともだちと はなす"], "correct": 0, "explain": "じつぎも しじを きくところから はじまるよ。"}, {"icon": "🎨", "scene": "「この いろだけ つかってね」と いわれました。どうする？", "choices": ["いわれた いろを つかう", "すきな いろを ぜんぶ つかう", "となりの こに きく"], "correct": 0, "explain": "できばえだけでなく しじを まもれるかも だいじだよ。"}, {"icon": "🧱", "scene": "つみきの みほんを みせてもらいました。どうする？", "choices": ["みほんを よく みてから はじめる", "みないで すぐ つくる", "ともだちのを まねする"], "correct": 0, "explain": "みほんを みる じかんも テストの ひとつだよ。"}, {"icon": "⚽", "scene": "「あいずで スタート」と いわれました。どうする？", "choices": ["あいずまで まつ", "すぐ はじめる", "となりの こに はなす"], "correct": 0, "explain": "まてること、あいずで うごけることも たいせつだよ。"}, {"icon": "👐", "scene": "じつぎが はやく おわりました。どうする？", "choices": ["そのばで しずかに まつ", "ほかの こに はなしかける", "ほかの こを みにいく"], "correct": 0, "explain": "じぶんが おわっても ほかの ひとは まだ テストちゅうかもしれないよ。"}]}, {"title": "ともだちを じゃましない", "questions": [{"icon": "👫", "scene": "となりの こが もんだいを といています。どうする？", "choices": ["じぶんの ことを する", "はなしかける", "こたえを みる"], "correct": 0, "explain": "はなしかけると、ともだちの しゅうちゅうも きれてしまうよ。"}, {"icon": "👀", "scene": "ともだちが なにを かいているか きになりました。どうする？", "choices": ["みないで じぶんの もんだいを する", "のぞきこむ", "こたえを きく"], "correct": 0, "explain": "テストは じぶんの ちからを みてもらう じかんだよ。"}, {"icon": "🤝", "scene": "ともだちが こまっているように みえます。どうする？", "choices": ["せんせいに まかせる", "こたえを おしえる", "はなしかける"], "correct": 0, "explain": "テストちゅうは せんせいに まかせよう。"}, {"icon": "🎤", "scene": "ともだちが はなしかけてきました。どうする？", "choices": ["へんじを せず テストを つづける", "おしゃべりする", "おおごえで へんじする"], "correct": 0, "explain": "へんじを すると しゅうちゅうが きれるよ。"}, {"icon": "🧠", "scene": "まわりが きになってしまいます。どうする？", "choices": ["もんだいの かみに めを もどす", "ずっと まわりを みる", "だれかに はなしかける"], "correct": 0, "explain": "『めは もんだい、みみは せんせい』を おぼえておこう。"}]}, {"title": "きもちを きりかえる", "questions": [{"icon": "😕", "scene": "ひとつ まちがえたかも。どうする？", "choices": ["なおして つぎへ すすむ", "ずっと きにする", "テストを やめる"], "correct": 0, "explain": "ひとつの まちがいを ひきずらず、つぎに きりかえよう。"}, {"icon": "😣", "scene": "むずかしくて いやに なってきました。どうする？", "choices": ["ひといき ついて できるところから やる", "となりに はなす", "えんぴつを おく"], "correct": 0, "explain": "いま できることを ひとつ やろう。"}, {"icon": "😃", "scene": "かんたんで すぐ できました。どうする？", "choices": ["みなおして つぎに そなえる", "はしゃぐ", "となりに じまんする"], "correct": 0, "explain": "かんたんな ときほど うっかりミスを みなおそう。"}, {"icon": "😴", "scene": "ちょっと つかれて きました。どうする？", "choices": ["しせいを なおして もんだいに もどる", "つくえに ふせる", "おしゃべりする"], "correct": 0, "explain": "しせいを なおすと しゅうちゅうしやすくなるよ。"}, {"icon": "🙂", "scene": "つぎの もんだいが はじまります。どうする？", "choices": ["きもちを きりかえて せんせいを みる", "まえのことを ずっと かんがえる", "となりに はなす"], "correct": 0, "explain": "ひとつ おわったら つぎに きもちを きりかえよう。"}]}, {"title": "ほんばんの おやくそく", "questions": [{"icon": "🌟", "scene": "テストで たいせつな こうどうは？", "choices": ["しじを きいて さいごまで しゅうちゅうする", "はやく おわることだけ かんがえる", "となりの こを みる"], "correct": 0, "explain": "『しじをきく・しずかにする・さいごまで・みなおす』が だいじだよ。"}, {"icon": "👂", "scene": "せんせいが はなしている ときは？", "choices": ["みみと めを せんせいに むける", "ともだちに はなす", "さきに うごく"], "correct": 0, "explain": "せんせいの はなしは つぎに なにをするかの ヒントだよ。"}, {"icon": "🤫", "scene": "テストちゅうの おやくそくは？", "choices": ["しずかに じぶんの ことを する", "となりに はなす", "きょろきょろ する"], "correct": 0, "explain": "しずかに できると みんなが しゅうちゅうできるよ。"}, {"icon": "🔍", "scene": "はやく おわった ときは？", "choices": ["みなおしを する", "もう なにもしない", "となりの こを みる"], "correct": 0, "explain": "はやく おわることより さいごまで ていねいに することが だいじだよ。"}, {"icon": "🏆", "scene": "ほんばんで できたら かっこいいのは？", "choices": ["おちついて さいごまで がんばる", "となりの こに はなしかける", "しじを きかずに さきに やる"], "correct": 0, "explain": "じぶんの ちからを さいごまで だせるように れんしゅうしよう。"}]}], $=function(x){return document.getElementById(x)}, cleared=(function(){try{return JSON.parse(localStorage.getItem("test_focus_challenge")||"[]")}catch(e){return[]}})(),si=0,qi=0,pts=0,answered=false;
function save(){try{localStorage.setItem("test_focus_challenge",JSON.stringify(cleared))}catch(e){}}
function fire(n){var C=["#f66","#fd4","#5b7","#48e","#a6e"],i,e;for(i=0;i<n;i++){e=document.createElement("i");e.className="cf";e.style.left=innerWidth/2+"px";e.style.top=innerHeight*.24+"px";e.style.background=C[i%5];e.style.setProperty("--x",(Math.random()*620-310)+"px");e.style.setProperty("--y",(80+Math.random()*460)+"px");$("fx").appendChild(e);(function(x){setTimeout(function(){if(x.parentNode)x.parentNode.removeChild(x)},1300)})(e)}}
function snd(){try{var A=window.AudioContext||window.webkitAudioContext;if(!A)return;var a=new A(),o=a.createOscillator(),g=a.createGain();o.frequency.value=740;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start(0);o.stop(a.currentTime+.12)}catch(e){}}
function home(){$("home").className="card";$("quiz").className="card hidden";$("result").className="card result hidden";$("board").innerHTML="";for(var i=0;i<SETS.length;i++){var d=document.createElement("div");d.className="cell "+(cleared.indexOf(i)>=0?"done":"");d.innerHTML="<small>"+(i+1)+"</small><b style='font-size:28px'>"+(cleared.indexOf(i)>=0?"⭐":"・")+"</b>";$("board").appendChild(d)}var g=document.createElement("div");g.className="goal";g.innerHTML=cleared.length===SETS.length?"🏆 ゴール！ ぜんぶクリア！":"🏁 ゴール";$("board").appendChild(g);$("sets").innerHTML="";for(var j=0;j<SETS.length;j++){(function(i){var b=document.createElement("button");b.className="setbtn "+(cleared.indexOf(i)>=0?"done":"");b.innerHTML=(i+1)+". "+SETS[i].title+(cleared.indexOf(i)>=0?"　⭐クリア！":"");b.onclick=function(){start(i)};$("sets").appendChild(b)})(j)}}
function start(i){si=i;qi=0;pts=0;$("home").className="card hidden";$("result").className="card result hidden";$("quiz").className="card";renderQ()}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function renderQ(){answered=false;$("next").className="primary hidden";$("msg").innerHTML="";var q=SETS[si].questions[qi];$("sp").innerHTML="セット "+(si+1)+" / "+SETS.length;$("qp").innerHTML=(qi+1)+" / 5";$("scene").innerHTML=q.icon;$("qt").innerHTML=q.scene;$("choices").innerHTML="";var arr=[];for(var i=0;i<q.choices.length;i++)arr.push({t:q.choices[i],ok:i===q.correct});shuffle(arr);for(var k=0;k<arr.length;k++){(function(o){var b=document.createElement("button");b.className="choice";b.innerHTML=o.t;b.onclick=function(){choose(b,o.ok,q.explain)};$("choices").appendChild(b)})(arr[k])}}
function choose(b,ok,explain){if(answered)return;answered=true;var bs=document.getElementsByClassName("choice");for(var i=0;i<bs.length;i++)bs[i].disabled=true;if(ok){pts++;b.className+=" correct";$("msg").innerHTML="⭕ せいかい！<div class='explain'>"+explain+"</div>";snd()}else{b.className+=" wrong";$("msg").innerHTML="△ おしい！<div class='explain'>"+explain+"</div>"}$("next").className="primary"}
$("next").onclick=function(){qi++;if(qi<5)renderQ();else finish()};
function finish(){$("quiz").className="card hidden";$("result").className="card result";$("stamp").className="stamp hidden";if(pts===5){if(cleared.indexOf(si)<0){cleared.push(si);cleared.sort(function(a,b){return a-b});save()}$("big").innerHTML=cleared.length===SETS.length?"🏆":"🎉";$("rt").innerHTML=cleared.length===SETS.length?"ゴール！":"5もん ぜんぶ せいかい！";$("rr").innerHTML=cleared.length===SETS.length?"『しじをきく・しずかにする・さいごまで・みなおす』を おぼえたね！":"⭐スタンプを 1こ ゲット！";$("stamp").className="stamp";$("rb").innerHTML="すごろくを みる";fire(cleared.length===SETS.length?180:110)}else{$("big").innerHTML="💪";$("rt").innerHTML=pts+" / 5 もん せいかい";$("rr").innerHTML="5もん ぜんぶ せいかいで スタンプだよ。もういちど やってみよう！";$("rb").innerHTML="もういちど ちょうせん"}}
$("rb").onclick=function(){if(pts===5)home();else start(si)};$("back").onclick=home;$("reset").onclick=function(){if(confirm("スタンプを ぜんぶ けしますか？")){cleared=[];save();home()}};home();
</script></body></html>
